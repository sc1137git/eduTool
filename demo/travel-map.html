<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人文踏查規劃助手</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --navy:   #0b2d4e;
  --navy2:  #1a4a70;
  --blue:   #2478b5;
  --gold:   #e0a820;
  --red:    #c0392b;
  --green:  #27ae60;
  --purple: #8e44ad;
  --mist:   #b0cfe0;
  --c-food: #e74c3c;
  --c-sight:#2478b5;
  --c-cult: #8e44ad;
  --sel-glow: 0 0 0 3px #e0a820, 0 4px 18px rgba(224,168,32,.3);
  --panel:  #f4f7fa;
  --border: #dde5ef;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Noto Sans TC', sans-serif; background: #0b1e30; color: #1a2030; display: flex; flex-direction: column; }

/* ─── TOPBAR ─── */
.topbar {
  flex-shrink: 0;
  background: linear-gradient(135deg, #07192a 0%, #0e2e4a 100%);
  border-bottom: 2px solid rgba(224,168,32,.25);
  padding: 0 18px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 14px;
  z-index: 200;
}
.brand { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.brand-badge { font-size: 9px; letter-spacing: 2.5px; color: var(--gold); font-weight: 700; text-transform: uppercase; line-height: 1; margin-bottom: 2px; }
.brand-title { font-family: 'Noto Serif TC', serif; font-size: clamp(13px, 2.2vw, 18px); color: #fff; font-weight: 700; line-height: 1; }
.brand-title em { color: var(--gold); font-style: normal; }

/* KEY ROW */
.key-row { display: flex; align-items: center; gap: 6px; }
.key-lbl { font-size: 10px; color: var(--mist); white-space: nowrap; }
.key-inp {
  background: rgba(255,255,255,.08); border: 1px solid rgba(180,220,240,.2);
  border-radius: 7px; padding: 5px 9px; color: #fff; font-size: 11px;
  font-family: 'DM Mono', monospace; outline: none; width: 170px;
}
.key-inp::placeholder { color: rgba(255,255,255,.22); }
.key-inp:focus { border-color: var(--blue); }
.btn-xs {
  font-size: 11px; font-weight: 700; padding: 5px 11px; border: none;
  border-radius: 7px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  white-space: nowrap; transition: opacity .2s;
  background: linear-gradient(135deg, var(--blue), var(--navy2)); color: #fff;
}
.btn-xs:hover { opacity: .85; }
.kdot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; transition: all .3s; }
.kdot.ok { background: #2ecc71; box-shadow: 0 0 5px #2ecc71; }

/* MODE TOGGLE */
.mode-toggle {
  display: flex; background: rgba(0,0,0,.3); border-radius: 8px;
  padding: 3px; gap: 3px; flex-shrink: 0;
}
.mode-btn {
  font-size: 11px; font-weight: 700; padding: 5px 13px; border-radius: 6px;
  border: none; cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  color: rgba(255,255,255,.55); background: transparent; transition: all .2s;
  white-space: nowrap;
}
.mode-btn.active-student { background: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(36,120,181,.4); }
.mode-btn.active-teacher { background: var(--gold); color: var(--navy); box-shadow: 0 2px 8px rgba(224,168,32,.4); }

/* ─── MAIN GRID ─── */
.main {
  flex: 1; display: grid;
  grid-template-columns: 1fr 400px;
  grid-template-rows: 1fr;
  overflow: hidden;
}
@media (max-width: 820px) {
  html, body { overflow: auto; }
  .main { grid-template-columns: 1fr; grid-template-rows: 300px 1fr; overflow: visible; }
}

/* ─── MAP ─── */
.map-col { position: relative; display: flex; flex-direction: column; overflow: hidden; }
#leaflet-map { flex: 1; min-height: 0; }
.leaflet-popup-content-wrapper { border-radius: 10px!important; padding: 0!important; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.2)!important; }
.leaflet-popup-content { margin: 0!important; }
.popup-body { padding: 11px 13px; font-family: 'Noto Sans TC', sans-serif; }
.popup-name { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 3px; }
.popup-desc { font-size: 11px; color: #557; line-height: 1.5; margin-bottom: 6px; }
.popup-stay { font-size: 10px; color: #889; background: #f0f5f9; padding: 2px 8px; border-radius: 5px; display: inline-block; }
.popup-btn { display: block; width: 100%; margin-top: 8px; padding: 6px; background: linear-gradient(135deg, var(--blue), var(--navy)); color: #fff; border: none; border-radius: 7px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }

/* ─── RIGHT PANEL ─── */
.side-col {
  background: var(--panel); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}

/* TAB BAR inside side panel */
.side-tabs {
  display: flex; background: #fff; border-bottom: 2px solid var(--border);
  flex-shrink: 0; overflow-x: auto;
}
.stab {
  flex-shrink: 0; flex: 1; padding: 9px 5px; font-size: 11px; font-weight: 600;
  color: #778; border: none; background: transparent; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all .2s; font-family: 'Noto Sans TC', sans-serif;
  white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 3px;
}
.stab.active { color: var(--navy); border-bottom-color: var(--blue); background: #f6fbff; }
.sbadge {
  background: var(--gold); color: #fff; border-radius: 9px;
  font-size: 10px; padding: 1px 6px; font-weight: 700; display: none;
}
.sbadge.on { display: inline-block; }

.side-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.tab-pane { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.tab-pane.active { display: flex; }
.scrollable { flex: 1; overflow-y: auto; }

/* ─── SHARED: SPOT CARDS ─── */
.cat-row {
  flex-shrink: 0; display: flex; gap: 6px; padding: 8px 11px 0;
  background: var(--panel); overflow-x: auto;
}
.cpill {
  flex-shrink: 0; padding: 4px 11px; font-size: 11px; font-weight: 600;
  border: 1.5px solid var(--border); border-radius: 12px; background: #fff;
  color: #557; cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
  transition: all .15s; white-space: nowrap;
}
.cpill.on { color: #fff; border-color: transparent; }
.cpill[data-cat="all"].on    { background: var(--navy); }
.cpill[data-cat="food"].on   { background: var(--c-food); }
.cpill[data-cat="sight"].on  { background: var(--c-sight); }
.cpill[data-cat="culture"].on{ background: var(--c-cult); }

.spot-list { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
.scard {
  background: #fff; border: 2.5px solid var(--border); border-radius: 12px;
  padding: 10px 12px; cursor: pointer; position: relative;
  transition: all .17s; display: flex; gap: 10px; align-items: flex-start; user-select: none;
}
.scard:hover { border-color: #a0c8e8; box-shadow: 0 3px 12px rgba(36,120,181,.1); transform: translateY(-1px); }
.scard.sel { border-color: var(--gold); background: linear-gradient(135deg,#fffbee,#fff8e0); box-shadow: var(--sel-glow); transform: translateY(-2px); }
.scard.hide { display: none; }
.sel-num { position: absolute; top: -9px; left: 10px; background: var(--navy); color: var(--gold); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 7px; display: none; }
.scard.sel .sel-num { display: block; }
.chk { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid #ccd8e8; display: flex; align-items: center; justify-content: center; font-size: 15px; color: transparent; background: #f5f8fc; transition: all .17s; }
.scard.sel .chk { background: var(--gold); border-color: var(--gold); color: #fff; box-shadow: 0 2px 8px rgba(224,168,32,.5); }
.semoji { font-size: 24px; flex-shrink: 0; margin-top: 1px; }
.sinfo { flex: 1; min-width: 0; padding-right: 32px; }
.sname { font-size: 12.5px; font-weight: 700; color: #1a2030; margin-bottom: 2px; }
.scard.sel .sname { color: #6a4200; }
.sdesc { font-size: 11px; color: #667; line-height: 1.45; }
.stag { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 6px; margin-top: 4px; }
.tag-food    { background: #fde8e8; color: #b52020; }
.tag-sight   { background: #e0f0fb; color: #1a6aaa; }
.tag-culture { background: #efe8fd; color: #6a20aa; }

/* bottom bar */
.bot-bar { flex-shrink: 0; padding: 9px 11px; background: #fff; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.bot-bar span { flex: 1; font-size: 12px; color: #667; font-weight: 500; }
.btn-ghost { font-size: 11px; padding: 6px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #889; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 600; transition: all .15s; }
.btn-ghost:hover { border-color: var(--red); color: var(--red); }
.btn-navy { font-size: 12px; padding: 7px 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--navy)); color: #fff; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; transition: all .15s; white-space: nowrap; }
.btn-navy:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
.btn-navy:disabled { opacity: .35; cursor: not-allowed; }

/* ─── SORT ─── */
.sort-wrap { flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; overflow-y: auto; }
.sort-hint { font-size: 12px; color: #557; background: #f0f8ff; border: 1px solid #c8dff5; border-radius: 9px; padding: 10px 12px; line-height: 1.65; }
.sort-hint strong { color: var(--navy); }
.sort-list-wrap { display: flex; flex-direction: column; gap: 6px; }
.srt-item {
  background: #fff; border: 2px solid var(--border); border-radius: 11px;
  padding: 9px 12px; display: flex; align-items: center; gap: 9px;
  cursor: grab; user-select: none; touch-action: none; transition: all .15s;
}
.srt-item.drag-over { border-color: var(--gold); background: #fff8e0; box-shadow: var(--sel-glow); }
.srt-item.dragging  { opacity: .4; transform: scale(.97); }
.dh { color: #bbb; font-size: 17px; flex-shrink: 0; }
.srt-n { width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.srt-emoji { font-size: 18px; flex-shrink: 0; }
.srt-name  { flex: 1; font-size: 12px; font-weight: 700; color: #1a2030; }
.srt-tag   { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
.sort-actions { display: flex; gap: 8px; align-items: center; }
.sort-actions span { flex: 1; font-size: 11px; color: #889; }
.btn-auto { font-size: 11px; padding: 6px 11px; border: 1px solid rgba(36,120,181,.3); border-radius: 8px; background: #fff; color: var(--navy); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 600; transition: all .15s; }
.btn-auto:hover { background: var(--navy); color: #fff; }
.btn-green { padding: 8px 16px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--green), #1e8449); color: #fff; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; font-size: 12px; transition: opacity .2s; width: 100%; margin-top: 4px; }
.btn-green:hover { opacity: .88; }

/* ─── ROUTE ─── */
.route-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; gap: 12px; padding: 30px; }
.route-empty .bigicon { font-size: 48px; opacity: .3; }
.route-empty p { font-size: 13px; color: #889; line-height: 1.7; }
.route-list { padding: 12px; display: flex; flex-direction: column; gap: 0; }
.rh { font-size: 13px; font-weight: 700; color: #1a2030; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 2px; display: flex; align-items: center; }
.rcard { background: #fff; border-radius: 12px; padding: 11px 13px; border-left: 4px solid var(--blue); box-shadow: 0 2px 7px rgba(0,0,0,.06); cursor: pointer; transition: all .15s; }
.rcard:hover { box-shadow: 0 4px 14px rgba(36,120,181,.16); transform: translateX(2px); }
.rcard.fc { border-left-color: var(--c-food); }
.rcard.cc { border-left-color: var(--c-cult); }
.rstep-h { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.rstep-n { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rcard.fc .rstep-n { background: var(--c-food); }
.rcard.cc .rstep-n { background: var(--c-cult); }
.rstep-emoji { font-size: 16px; }
.rstep-name  { flex: 1; font-size: 13px; font-weight: 700; color: #1a2030; }
.rstep-time  { font-size: 11px; color: #889; background: #f0f5f9; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
.rstep-note  { font-size: 11px; color: #446; line-height: 1.55; }
.walk-row { text-align: center; font-size: 11px; color: #aab; padding: 5px 0; display: flex; align-items: center; justify-content: center; gap: 7px; }
.walk-row::before, .walk-row::after { content: ''; display: block; width: 28px; height: 1px; background: #d0dce8; }
.rsummary { background: linear-gradient(135deg,#e8f4fb,#f0f8f0); border: 1px solid #b8ddf0; border-radius: 10px; padding: 11px 13px; margin-top: 10px; font-size: 12px; color: #334; line-height: 1.8; }
.rsummary strong { color: var(--navy); }
.btn-to-ws { display: block; width: 100%; margin-top: 10px; padding: 10px; background: linear-gradient(135deg, var(--purple), #6c3483); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: opacity .2s; text-align: center; }
.btn-to-ws:hover { opacity: .88; }

/* ─── WORKSHEET ─── */
.ws-intro { font-size: 12px; color: #334; background: #f3e8fd; border: 1px solid #ce93d8; border-radius: 10px; padding: 11px 13px; margin: 10px; line-height: 1.7; }
.ws-intro strong { color: #6a1b9a; }
.ws-block { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; margin: 0 10px 10px; overflow: hidden; }
.ws-hd { padding: 10px 13px; background: linear-gradient(135deg,#f6fbff,#f0f5f9); border-bottom: 1px solid #f0f5f9; cursor: pointer; display: flex; align-items: center; gap: 8px; user-select: none; }
.ws-hd:hover { background: #edf4fb; }
.ws-step { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ws-hd-emoji { font-size: 17px; }
.ws-hd-name { flex: 1; font-size: 13px; font-weight: 700; color: var(--navy); }
.ws-status { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.ws-status.filled { background: #e8f5e9; color: #2e7d32; }
.ws-status.empty  { background: #fff3e0; color: #e65100; }
.ws-body { padding: 12px 13px; display: flex; flex-direction: column; gap: 9px; }
.ws-field label { font-size: 11px; font-weight: 700; color: var(--navy); display: block; margin-bottom: 4px; }
.ws-field textarea { width: 100%; border: 1.5px solid #d0dce8; border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; resize: vertical; outline: none; line-height: 1.6; color: #1a2030; background: #f9fbff; min-height: 50px; transition: border-color .2s; }
.ws-field textarea:focus { border-color: var(--blue); background: #fff; }
.ws-field textarea::placeholder { color: #bbc; }
.btn-ai-suggest { width: 100%; padding: 7px; background: linear-gradient(135deg, var(--purple), #6c3483); color: #fff; border: none; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: opacity .2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
.btn-ai-suggest:hover { opacity: .85; }
.btn-ai-suggest:disabled { opacity: .4; cursor: not-allowed; }
.ws-export-bar { flex-shrink: 0; padding: 10px 11px; background: #fff; border-top: 1px solid var(--border); display: flex; gap: 8px; }
.btn-copy-ws { flex: 1; padding: 9px; background: linear-gradient(135deg, var(--green), #1e8449); color: #fff; border: none; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: opacity .2s; }
.btn-gdoc    { flex: 1; padding: 9px; background: linear-gradient(135deg, #1a73e8, #1557b0); color: #fff; border: none; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: opacity .2s; }
.btn-copy-ws:hover, .btn-gdoc:hover { opacity: .88; }

/* ─── CHAT ─── */
.chips { flex-shrink: 0; padding: 7px 10px 3px; display: flex; gap: 6px; flex-wrap: wrap; background: var(--panel); }
.chip { font-size: 11px; padding: 5px 10px; border: 1px solid rgba(36,120,181,.22); border-radius: 13px; background: #fff; color: var(--navy); cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; transition: all .15s; }
.chip:hover { background: var(--navy); color: #fff; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 9px; }
.msg { display: flex; gap: 7px; animation: fadeUp .25s ease; }
.msg.u { flex-direction: row-reverse; }
.av { width: 27px; height: 27px; border-radius: 50%; background: var(--navy); font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
.msg.u .av { background: var(--gold); }
.bub { max-width: calc(100% - 38px); padding: 8px 12px; border-radius: 12px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.ai .bub { background: #fff; border: 1px solid #dde8f8; color: #1a2030; border-radius: 3px 12px 12px 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.msg.u  .bub { background: linear-gradient(135deg, var(--blue), var(--navy2)); color: #fff; border-radius: 12px 3px 12px 12px; }
.msg.sys { justify-content: center; }
.msg.sys .bub { background: #fff8e0; border: 1px solid #f5c842; color: #7a5800; border-radius: 8px; font-size: 11px; text-align: center; max-width: 90%; }
.tdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin: 0 2px; animation: bounce 1.1s infinite; }
.tdot:nth-child(2) { animation-delay: .18s; }
.tdot:nth-child(3) { animation-delay: .36s; }
.chat-input { flex-shrink: 0; padding: 9px; border-top: 1px solid var(--border); background: #fff; display: flex; gap: 7px; align-items: flex-end; }
.chat-input textarea { flex: 1; border: 1.5px solid #d0dce8; border-radius: 10px; padding: 8px 11px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; resize: none; outline: none; line-height: 1.5; max-height: 80px; background: #f7fbff; color: #1a2030; transition: border-color .2s; }
.chat-input textarea:focus { border-color: var(--blue); background: #fff; }
.chat-input textarea::placeholder { color: #abb; }
.btn-send { background: linear-gradient(135deg, var(--blue), var(--navy)); color: #fff; border: none; border-radius: 10px; width: 36px; height: 36px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-send:disabled { opacity: .4; cursor: not-allowed; }

/* ─── TEACHER PANEL ─── */
.teacher-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.t-section { background: #fff; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; }
.t-section h3 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.t-section h3 .hint { font-size: 11px; font-weight: 400; color: #889; margin-left: 4px; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.form-row label { font-size: 11px; color: #445; display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 90px; }
.form-row input, .form-row textarea, .form-row select {
  border: 1.5px solid #d0dce8; border-radius: 7px; padding: 6px 9px;
  font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none;
  color: #1a2030; background: #f9fbff; width: 100%; transition: border-color .2s;
}
.form-row input:focus, .form-row textarea:focus, .form-row select:focus { border-color: var(--blue); background: #fff; }
.form-row textarea { resize: vertical; min-height: 50px; }
.gen-row { display: flex; gap: 7px; margin-bottom: 5px; }
.gen-row input { flex: 1; border: 1.5px solid #d0dce8; border-radius: 8px; padding: 7px 10px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none; color: #1a2030; background: #f9fbff; }
.gen-row input:focus { border-color: var(--blue); }
.btn-purple { background: linear-gradient(135deg, var(--purple), #6c3483); color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; transition: opacity .2s; }
.btn-purple:hover { opacity: .85; }
.btn-purple:disabled { opacity: .4; cursor: not-allowed; }
.status-txt { font-size: 11px; color: #889; min-height: 16px; }
.btn-full { width: 100%; padding: 9px; border: none; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; transition: opacity .2s; margin-top: 6px; color: #fff; }
.btn-full:hover { opacity: .88; }
.btn-full.green  { background: linear-gradient(135deg, var(--green), #1e8449); }
.btn-full.purple { background: linear-gradient(135deg, var(--purple), #6c3483); }
.btn-full.amber  { background: linear-gradient(135deg, #d97706, #b45309); }
.btn-full:disabled { opacity: .4; cursor: not-allowed; }

/* teacher spot mini list */
.t-spot-row { background: #f7fbff; border: 1.5px solid #d4e8f8; border-radius: 9px; padding: 8px 11px; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.t-spot-row .te { font-size: 18px; flex-shrink: 0; }
.t-spot-row .tn { flex: 1; font-size: 12px; font-weight: 700; color: #1a2030; }
.t-spot-row .tt { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px; }
.t-spot-row .td-btn { font-size: 10px; padding: 3px 8px; border: 1px solid rgba(192,57,43,.3); background: #fff; color: var(--red); border-radius: 6px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; flex-shrink: 0; }
.t-spot-row .td-btn:hover { background: var(--red); color: #fff; }

/* theme list */
.thm-card { background: #f7fbff; border: 1.5px solid #d4e8f8; border-radius: 10px; padding: 11px 13px; display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.thm-card.cur { border-color: var(--gold); background: linear-gradient(135deg,#fffbee,#fff8e0); }
.thm-info { flex: 1; }
.thm-name { font-size: 13px; font-weight: 700; color: var(--navy); }
.thm-meta { font-size: 11px; color: #889; }
.thm-btns { display: flex; gap: 5px; flex-shrink: 0; }
.thm-btn { font-size: 10px; padding: 4px 9px; border-radius: 6px; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; border: 1px solid; }
.thm-btn.load { border-color: var(--blue); color: var(--blue); background: #fff; }
.thm-btn.del  { border-color: rgba(192,57,43,.3); color: var(--red); background: #fff; }
.thm-btn.load:hover { background: var(--blue); color: #fff; }
.thm-btn.del:hover  { background: var(--red); color: #fff; }
.no-thm { text-align: center; color: #aaa; font-size: 12px; padding: 18px; background: #f7fbff; border-radius: 8px; border: 1.5px dashed #c8daf0; }
.thm-save-row { display: flex; gap: 7px; margin-top: 8px; }
.thm-save-row input { flex: 1; border: 1.5px solid #d0dce8; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-family: 'Noto Sans TC', sans-serif; outline: none; color: #1a2030; }
.thm-save-row input:focus { border-color: var(--blue); }

/* prompt box */
.prompt-box { background: #1a2030; border-radius: 10px; padding: 12px 14px; font-family: 'DM Mono', monospace; font-size: 11px; color: #a8d8ea; line-height: 1.7; white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow-y: auto; border: 1px solid #2d3a50; margin-bottom: 8px; }
.prompt-empty { text-align: center; padding: 30px; color: #aaa; font-size: 12px; line-height: 1.7; background: #f7fbff; border-radius: 10px; border: 1.5px dashed #c8daf0; }

/* ─── MISC ─── */
.spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 4px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a2030; color: #fff; padding: 9px 20px; border-radius: 20px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; }

@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes bounce  { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(36,120,181,.18); border-radius: 3px; }
</style>
</head>
<body>

<!-- ═══ TOPBAR ═══ -->
<div class="topbar">
  <div class="brand">
    <div class="brand-badge">人文踏查</div>
    <div class="brand-title"><em id="themeLabel">基隆港城</em> 踏查規劃助手</div>
  </div>
  <!-- KEY -->
  <div class="key-row">
    <span class="key-lbl">Gemini Key：</span>
    <input type="password" class="key-inp" id="keyInp" placeholder="AIza…">
    <button class="btn-xs" onclick="applyKey()">套用</button>
    <div class="kdot" id="kdot"></div>
  </div>
  <!-- MODE TOGGLE -->
  <div class="mode-toggle">
    <button class="mode-btn active-student" id="modeS" onclick="setMode('student')">🎓 學生模式</button>
    <button class="mode-btn" id="modeT" onclick="setMode('teacher')">🔧 教師模式</button>
  </div>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">

  <!-- MAP -->
  <div class="map-col">
    <div id="leaflet-map"></div>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-col" id="sideCol">
    <!-- content rendered by JS -->
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ───────────────────────────────────────
//  CONSTANTS
// ───────────────────────────────────────
const TYPE_TAG = {food:'美食', sight:'景點', culture:'文化'};
const TYPE_COL = {food:'#e74c3c', sight:'#2478b5', culture:'#8e44ad'};
const LS_KEY   = 'ft_themes_v3';
const LS_GKEY  = 'ft_gemini_key';

const DEFAULT_CONFIG = {
  themeTitle: '基隆港城', stationName: '基隆火車站',
  stationLat: 25.1276, stationLng: 121.7628, mapZoom: 14,
  aiContext: '基隆核心人文主題：港都移民史、日治建設、漁業文化、閩南信仰、清法戰爭、現代港口轉型、海洋科技。',
  targetAudience: '高中資優生',
};
const DEFAULT_SPOTS = [
  {id:1, name:'廟口夜市',           emoji:'🍢',type:'food',   lat:25.12774,lng:121.74310,desc:'全台知名夜市，滷肉飯、天婦羅、一口吃香腸',note:'觀察攤販空間分布與廟宇的共生關係',stay:'45–60 分'},
  {id:2, name:'奠濟宮',             emoji:'🏮',type:'culture',lat:25.12783,lng:121.74289,desc:'廟口精神核心，清代建廟祭祀開漳聖王',note:'閩南移民信仰中心，研究廟宇與市集共生空間',stay:'20 分'},
  {id:3, name:'正濱漁港彩色屋',     emoji:'🎨',type:'sight',  lat:25.15328,lng:121.77408,desc:'日治漁業遺址改造，彩虹建築倒影成地標',note:'分析漁港再生計畫平衡文化保留與觀光轉型',stay:'30 分'},
  {id:4, name:'和平島地質公園',     emoji:'🪨',type:'sight',  lat:25.15578,lng:121.77653,desc:'千萬年海蝕奇景，兼具地質與殖民歷史',note:'探討自然地貌與人文歷史的複合意義',stay:'60 分'},
  {id:5, name:'清法戰爭紀念園區',   emoji:'🎖',type:'culture',lat:25.13100,lng:121.76310,desc:'1884年清法戰爭基隆之役歷史遺跡',note:'思考殖民與抵抗的歷史詮釋',stay:'30 分'},
  {id:6, name:'基隆故事館',         emoji:'🏠',type:'culture',lat:25.12640,lng:121.74060,desc:'日式官舍改建，常設「基隆學」展覽',note:'了解港都日治生活史，分析文化資產活化策略',stay:'40 分'},
  {id:7, name:'崁仔頂魚市',         emoji:'🐟',type:'food',   lat:25.12850,lng:121.74450,desc:'北台灣最大生鮮魚市，凌晨競標',note:'觀察海洋產業供應鏈，訪談魚販了解漁港經濟',stay:'30 分'},
  {id:8, name:'中正公園忠烈祠',     emoji:'⛩',type:'culture',lat:25.12360,lng:121.75650,desc:'日治神社遺址改建，俯瞰基隆港全景',note:'探討戰後空間再詮釋，比較日式與中式建築',stay:'30 分'},
  {id:9, name:'基隆文化中心',       emoji:'🎭',type:'culture',lat:25.13000,lng:121.74640,desc:'舉辦藝文展覽與表演，當代基隆文化脈動',note:'觀察在地藝術生態，思考公共文化空間的角色',stay:'30 分'},
  {id:10,name:'基隆港西岸碼頭',     emoji:'⚓',type:'sight',  lat:25.13780,lng:121.75210,desc:'百年商港，台灣北部最重要港埠',note:'對照歷史文獻思考港都變遷',stay:'30 分'},
  {id:11,name:'太白莊肉焿老攤',     emoji:'🍲',type:'food',   lat:25.12750,lng:121.74350,desc:'50年老字號，基隆特色肉焿湯麵',note:'品嚐閩南飲食文化，觀察老攤保存在地記憶',stay:'20 分'},
  {id:12,name:'海洋廣場',           emoji:'🌊',type:'sight',  lat:25.13880,lng:121.75830,desc:'基隆港口門戶，舉辦港都節慶的公共空間',note:'觀察公共空間設計如何反映港口身份認同',stay:'20 分'},
  {id:13,name:'國立海洋科技博物館', emoji:'🔭',type:'culture',lat:25.15536,lng:121.78105,desc:'台灣唯一海洋科技主題博物館',note:'探索海洋科技與人類社會的關係',stay:'90–120 分'},
];

// ───────────────────────────────────────
//  STATE
// ───────────────────────────────────────
let mode       = 'student';   // 'student' | 'teacher'
let gKey       = '';
let cfg        = {...DEFAULT_CONFIG};
let SPOTS      = JSON.parse(JSON.stringify(DEFAULT_SPOTS));
let selOrder   = [];
let curCat     = 'all';
let chatHist   = [];
let wsData     = {};
let route      = [];   // built route with walkFromPrev
let themes     = {};
let curThemeId = null;

// student sub-tab
let sTab = 'spots';   // spots | sort | route | ws | chat
// teacher sub-tab
let tTab = 'config';  // config | spots-mgr | prompt | themes

// map state
let lMap, lMarkers = {}, stationM = null, routeLine = null, routeArrows = [];

// ───────────────────────────────────────
//  BOOT
// ───────────────────────────────────────
function boot() {
  const saved = localStorage.getItem(LS_GKEY) || '';
  if (saved) { gKey = saved; document.getElementById('keyInp').value = saved; document.getElementById('kdot').className = 'kdot ok'; }
  try { themes = JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { themes = {}; }
  initMap();
  renderSide();
}

// ───────────────────────────────────────
//  API KEY
// ───────────────────────────────────────
function applyKey() {
  const v = document.getElementById('keyInp').value.trim();
  if (!v) return;
  gKey = v; localStorage.setItem(LS_GKEY, v);
  document.getElementById('kdot').className = 'kdot ok';
  toast('✅ API Key 已儲存');
}

// ───────────────────────────────────────
//  MODE SWITCH
// ───────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('modeS').className = 'mode-btn' + (m === 'student' ? ' active-student' : '');
  document.getElementById('modeT').className = 'mode-btn' + (m === 'teacher' ? ' active-teacher' : '');
  if (m === 'student') sTab = 'spots';
  else tTab = 'config';
  renderSide();
}

// ───────────────────────────────────────
//  MAP
// ───────────────────────────────────────
function initMap() {
  lMap = L.map('leaflet-map').setView([cfg.stationLat, cfg.stationLng], cfg.mapZoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(lMap);
  placeStation();
  SPOTS.forEach(s => addMk(s));
}
function placeStation() {
  if (stationM) lMap.removeLayer(stationM);
  stationM = L.marker([cfg.stationLat, cfg.stationLng], {
    icon: L.divIcon({ className:'', html:`<div style="background:#c0392b;width:32px;height:32px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.4)">🚉</div>`, iconSize:[32,32], iconAnchor:[16,32] }),
    zIndexOffset: 1000
  }).bindTooltip(cfg.stationName + '（出發點）', {direction:'top'}).addTo(lMap);
}
function pinIcon(s, sel, num) {
  const col = sel ? '#e0a820' : TYPE_COL[s.type];
  const inner = sel
    ? `<span style="transform:rotate(45deg);display:block;color:#fff;font-size:11px;font-weight:700;line-height:1">${num}</span>`
    : `<span style="transform:rotate(45deg);display:block;font-size:13px;line-height:1">${s.emoji}</span>`;
  const sh = sel ? '0 0 0 4px rgba(224,168,32,.4),0 2px 8px rgba(0,0,0,.3)' : '0 2px 7px rgba(0,0,0,.28)';
  return L.divIcon({ className:'',
    html: `<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;background:${col};border:2.5px solid #fff;transform:rotate(-45deg) ${sel?'scale(1.15)':'scale(1)'};display:flex;align-items:center;justify-content:center;box-shadow:${sh};transition:all .2s">${inner}</div>`,
    iconSize:[34,34], iconAnchor:[9,34], popupAnchor:[8,-34]
  });
}
function addMk(s) {
  const sel = selOrder.includes(s.id), num = selOrder.indexOf(s.id)+1;
  const m = L.marker([s.lat, s.lng], { icon: pinIcon(s,sel,num), zIndexOffset: sel?500:0 });
  m.bindPopup(`<div class="popup-body"><div class="popup-name">${s.emoji} ${s.name}</div><div class="popup-desc">${s.desc}</div><div class="popup-stay">⏱ 建議停留：${s.stay}</div><button class="popup-btn" onclick="mapToggle(${s.id})">${sel?'✓ 已選取・點擊取消':'＋ 加入行程'}</button></div>`, {maxWidth:210});
  m.addTo(lMap); lMarkers[s.id] = m;
}
function rebuildMks() { Object.values(lMarkers).forEach(m=>lMap.removeLayer(m)); lMarkers={}; SPOTS.forEach(s=>addMk(s)); }
function refreshMks() {
  SPOTS.forEach(s => {
    const m = lMarkers[s.id]; if (!m) return;
    const sel = selOrder.includes(s.id), num = selOrder.indexOf(s.id)+1;
    m.setIcon(pinIcon(s,sel,num)); m.setZIndexOffset(sel?500:0);
  });
}
function mapToggle(id) { lMap.closePopup(); toggleSpot(id); }
function drawRoute(r) {
  clearRoute();
  const pts = [[cfg.stationLat,cfg.stationLng], ...r.map(s=>[s.lat,s.lng])];
  routeLine = L.polyline(pts, {color:'#e0a820', weight:4, opacity:.88, dashArray:'10,6'}).addTo(lMap);
  for (let i=0;i<pts.length-1;i++) {
    const a=pts[i], b=pts[i+1];
    const ang = Math.atan2(b[0]-a[0], b[1]-a[1]) * 180/Math.PI;
    const icon = L.divIcon({className:'', html:`<div style="transform:rotate(${-ang+90}deg);font-size:17px;color:#e0a820;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))">▲</div>`, iconSize:[20,20], iconAnchor:[10,10]});
    routeArrows.push(L.marker([(a[0]+b[0])/2,(a[1]+b[1])/2], {icon, interactive:false}).addTo(lMap));
  }
  lMap.fitBounds(routeLine.getBounds(), {padding:[40,40]});
}
function clearRoute() {
  if (routeLine) { lMap.removeLayer(routeLine); routeLine=null; }
  routeArrows.forEach(a=>lMap.removeLayer(a)); routeArrows=[];
}

// ───────────────────────────────────────
//  SIDE PANEL ROOT RENDER
// ───────────────────────────────────────
function renderSide() {
  const col = document.getElementById('sideCol');
  col.innerHTML = mode === 'student' ? buildStudent() : buildTeacher();
  if (mode === 'student') bindStudentEvents();
  else bindTeacherEvents();
}

// ═══════════════════════════════════════
//  STUDENT MODE
// ═══════════════════════════════════════
function buildStudent() {
  return `
  <!-- STUDENT TABS -->
  <div class="side-tabs">
    <button class="stab ${sTab==='spots'?'active':''}" onclick="setSTab('spots')">📍 景點 <span class="sbadge ${selOrder.length?'on':''}" id="sb1">${selOrder.length||''}</span></button>
    <button class="stab ${sTab==='sort' ?'active':''}" onclick="setSTab('sort')">↕ 排序</button>
    <button class="stab ${sTab==='route'?'active':''}" onclick="setSTab('route')">🗺 路線 <span class="sbadge ${route.length?'on':''}" id="sb2">${route.length||''}</span></button>
    <button class="stab ${sTab==='ws'   ?'active':''}" onclick="setSTab('ws')">📋 學習單</button>
    <button class="stab ${sTab==='chat' ?'active':''}" onclick="setSTab('chat')">🤖 AI</button>
  </div>
  <div class="side-body">
    ${sTab==='spots' ? buildSpotsPane()
    : sTab==='sort'  ? buildSortPane()
    : sTab==='route' ? buildRoutePane()
    : sTab==='ws'    ? buildWsPane()
    :                  buildChatPane()}
  </div>`;
}
function setSTab(t) { sTab = t; renderSide(); }

/* ── SPOTS PANE ── */
function buildSpotsPane() {
  const cards = [...selOrder.map(id=>SPOTS.find(s=>s.id===id)), ...SPOTS.filter(s=>!selOrder.includes(s.id))].filter(Boolean)
    .map(s => {
      const idx=selOrder.indexOf(s.id), sel=idx!==-1;
      const hide = curCat!=='all' && s.type!==curCat;
      return `<div class="scard${sel?' sel':''}${hide?' hide':''}" data-id="${s.id}" data-type="${s.type}">
        <div class="sel-num">#${idx+1}</div>
        <div class="semoji">${s.emoji}</div>
        <div class="sinfo">
          <div class="sname">${s.name}</div>
          <div class="sdesc">${s.desc}</div>
          <span class="stag tag-${s.type}">${TYPE_TAG[s.type]}</span>
        </div>
        <div class="chk">${sel?'✓':''}</div>
      </div>`;
    }).join('');
  return `<div class="tab-pane active">
    <div class="cat-row">
      ${['all','food','sight','culture'].map(c=>`<button class="cpill${curCat===c?' on':''}" data-cat="${c}" onclick="setCat('${c}',this)">${{all:'🗂 全部',food:'🍜 美食',sight:'🏞 景點',culture:'🏛 文化'}[c]}</button>`).join('')}
    </div>
    <div class="scrollable"><div class="spot-list">${cards}</div></div>
    <div class="bot-bar">
      <span>${selOrder.length?`已選 ${selOrder.length} 個景點`:'尚未選取景點'}</span>
      <button class="btn-ghost" onclick="clearSel()">清除</button>
      <button class="btn-navy" onclick="setSTab('sort')" ${selOrder.length<1?'disabled':''}>↕ 排序 →</button>
    </div>
  </div>`;
}
function setCat(cat) { curCat=cat; renderSide(); }
function toggleSpot(id) {
  const i=selOrder.indexOf(id);
  if(i!==-1) selOrder.splice(i,1); else selOrder.push(id);
  refreshMks(); clearRoute(); route=[];
  renderSide();
  const s=SPOTS.find(x=>x.id===id);
  if(s && selOrder.includes(id)) lMap.panTo([s.lat,s.lng]);
}
function clearSel() { selOrder=[]; refreshMks(); clearRoute(); route=[]; renderSide(); }

/* ── SORT PANE ── */
function buildSortPane() {
  if (!selOrder.length) return `<div class="tab-pane active"><div style="padding:20px;text-align:center;color:#889;font-size:13px;">請先在「景點」頁選取景點</div></div>`;
  const items = selOrder.map((id,i)=>{
    const s=SPOTS.find(x=>x.id===id);
    return `<div class="srt-item" data-id="${id}" draggable="true">
      <div class="dh">⠿</div>
      <div class="srt-n">${i+1}</div>
      <div class="srt-emoji">${s.emoji}</div>
      <div class="srt-name">${s.name}</div>
      <span class="srt-tag tag-${s.type}">${TYPE_TAG[s.type]}</span>
    </div>`;
  }).join('');
  return `<div class="tab-pane active">
    <div class="sort-wrap">
      <div class="sort-hint"><strong>拖曳</strong>調整踏查順序，或按「⚡ 自動最短」讓系統幫你排。</div>
      <div class="sort-list-wrap" id="sortList">${items}</div>
      <div class="sort-actions">
        <span>🚉 從 ${cfg.stationName} 出發</span>

function walkMin(a,b){
  const toR=d=>d*Math.PI/180,dl=toR(b.lat-a.lat),dg=toR(b.lng-a.lng);
  const x=Math.sin(dl/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dg/2)**2;
  return Math.round(2*6371000*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))/70);
}
function autoSort(){
  const st={lat:cfg.stationLat,lng:cfg.stationLng};
  const spots=selOrder.map(id=>SPOTS.find(s=>s.id===id));
  let cur=st,rem=[...spots],sorted=[];
  while(rem.length){let best=null,bd=Infinity;rem.forEach(s=>{const d=walkMin(cur,s);if(d<bd){bd=d;best=s;}});sorted.push(best);cur=best;rem=rem.filter(s=>s.id!==best.id);}
  selOrder=sorted.map(s=>s.id);refreshMks();renderSide();toast('⚡ 已自動排序');
}
function buildRoute(){
  if(!selOrder.length) return;
  let prev={lat:cfg.stationLat,lng:cfg.stationLng};
  route=selOrder.map(id=>{const s=SPOTS.find(x=>x.id===id);const w=walkMin(prev,s);prev=s;return{...s,walkFromPrev:w};});
  drawRoute(route); sTab='route'; renderSide();
}

// sort drag
function bindSortDrag(){
  const list=document.getElementById('sortList'); if(!list) return;
  let dragSrc=null;
  list.querySelectorAll('.srt-item').forEach(item=>{
    item.addEventListener('dragstart',function(e){dragSrc=this;this.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    item.addEventListener('dragover', function(e){e.preventDefault();list.querySelectorAll('.srt-item').forEach(i=>i.classList.remove('drag-over'));this.classList.add('drag-over');});
    item.addEventListener('drop',     function(e){
      e.preventDefault(); if(dragSrc===this) return;
      const items=[...list.querySelectorAll('.srt-item')];
      selOrder.splice(items.indexOf(this),0,selOrder.splice(items.indexOf(dragSrc),1)[0]);
      refreshMks(); renderSide();
    });
    item.addEventListener('dragend',  ()=>{list.querySelectorAll('.srt-item').forEach(i=>{i.classList.remove('dragging');i.classList.remove('drag-over');});dragSrc=null;});
    // touch
    let tSrc=null,tClone=null,tIdx=-1;
    item.addEventListener('touchstart',function(e){
      tSrc=this;tIdx=[...list.children].indexOf(this);this.classList.add('dragging');
      const r=this.getBoundingClientRect();tClone=this.cloneNode(true);
      tClone.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:9999;opacity:.85;border:2px solid #e0a820;border-radius:11px;background:#fff;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);`;
      document.body.appendChild(tClone);
    },{passive:true});
    item.addEventListener('touchmove',function(e){
      e.preventDefault();const t=e.touches[0];
      if(tClone){tClone.style.left=(t.clientX-tClone.offsetWidth/2)+'px';tClone.style.top=(t.clientY-tClone.offsetHeight/2)+'px';}
      list.querySelectorAll('.srt-item').forEach(i=>i.classList.remove('drag-over'));
      for(const el of list.querySelectorAll('.srt-item')){const r=el.getBoundingClientRect();if(t.clientY>=r.top&&t.clientY<=r.bottom){el.classList.add('drag-over');break;}}
    },{passive:false});
    item.addEventListener('touchend',function(){
      if(tClone){document.body.removeChild(tClone);tClone=null;}
      const items=[...list.querySelectorAll('.srt-item')],over=items.find(i=>i.classList.contains('drag-over'));
      if(over&&over!==tSrc){selOrder.splice(items.indexOf(over),0,selOrder.splice(tIdx,1)[0]);}
      list.querySelectorAll('.srt-item').forEach(i=>{i.classList.remove('dragging');i.classList.remove('drag-over');});
      tSrc=null;tIdx=-1;refreshMks();renderSide();
    });
  });
}

    gen.spots.forEach((s,i)=>{s.id=i+1;s.tag=TYPE_TAG[s.type]||'景點';});
    SPOTS.length=0;SPOTS.push(...gen.spots);
    if(gen.themeTitle){cfg.themeTitle=gen.themeTitle;document.getElementById('cfgTitle').value=gen.themeTitle;document.getElementById('themeLabel').textContent=gen.themeTitle;}
    if(gen.stationName){cfg.stationName=gen.stationName;document.getElementById('cfgStn').value=gen.stationName;}
    if(gen.stationLat){cfg.stationLat=gen.stationLat;document.getElementById('cfgLat').value=gen.stationLat;}
    if(gen.stationLng){cfg.stationLng=gen.stationLng;document.getElementById('cfgLng').value=gen.stationLng;}
    if(gen.aiContext){cfg.aiContext=gen.aiContext;document.getElementById('cfgCtx').value=gen.aiContext;}
    selOrder=[];route=[];clearRoute();rebuildMks();placeStation();lMap.setView([cfg.stationLat,cfg.stationLng],cfg.mapZoom);
    st.textContent=`✅ 生成 ${gen.spots.length} 個景點！切換到「景點管理」查看，或到學生模式選取。`;
  }catch(e){st.textContent='❌ 解析失敗：'+e.message;}
  finally{btn.disabled=false;btn.innerHTML='✨ 生成';}
}

/* ── T: SPOTS MANAGER ── */
function buildTSpots(){
  const rows=SPOTS.map(s=>`
    <div class="t-spot-row">
      <span class="te">${s.emoji}</span>
      <span class="tn">${s.name}</span>
      <span class="tt tag-${s.type}">${TYPE_TAG[s.type]}</span>
      <button class="td-btn" onclick="delSpot(${s.id})">✕</button>
    </div>`).join('');
  return `<div class="teacher-body">
    <div class="t-section">
      <h3>📍 景點清單 <span class="hint">共 ${SPOTS.length} 個</span></h3>
      ${rows||'<div style="color:#aaa;font-size:12px;padding:8px 0;">尚無景點，請先到「主題設定」用 AI 生成</div>'}
    </div>
    <div class="t-section">
      <h3>➕ 手動新增景點</h3>
      <div class="form-row">
        <label>名稱<input type="text" id="nName" placeholder="景點名稱"></label>
        <label>Emoji<input type="text" id="nEmoji" placeholder="🏛" style="text-align:center"></label>
        <label>類型<select id="nType"><option value="food">美食</option><option value="sight">景點</option><option value="culture" selected>文化</option></select></label>
      </div>
      <div class="form-row">
        <label>緯度<input type="number" id="nLat" step="0.00001" placeholder="25.12"></label>
        <label>經度<input type="number" id="nLng" step="0.00001" placeholder="121.74"></label>
        <label>停留<input type="text" id="nStay" placeholder="30 分鐘"></label>
      </div>
      <div class="form-row">
        <label>描述<input type="text" id="nDesc" placeholder="景點簡介…"></label>
      </div>
      <div class="form-row">
        <label>觀察重點<input type="text" id="nNote" placeholder="適合觀察的人文重點…"></label>
      </div>
      <button class="btn-full green" onclick="addSpot()">＋ 新增到清單</button>
    </div>
  </div>`;
}
function delSpot(id){
  if(!confirm('確定刪除？'))return;
  const i=SPOTS.findIndex(s=>s.id===id);if(i!==-1)SPOTS.splice(i,1);
  selOrder=selOrder.filter(x=>x!==id); lMap.removeLayer(lMarkers[id]); delete lMarkers[id];
  route=[];clearRoute();renderSide();
}
function addSpot(){
  const name=document.getElementById('nName').value.trim();
  const lat=parseFloat(document.getElementById('nLat').value);
  const lng=parseFloat(document.getElementById('nLng').value);
  if(!name||isNaN(lat)||isNaN(lng)){toast('請填寫：名稱、緯度、經度');return;}
  const type=document.getElementById('nType').value;
  const id=Math.max(0,...SPOTS.map(s=>s.id))+1;
  const s={id,name,emoji:document.getElementById('nEmoji').value.trim()||'📍',type,tag:TYPE_TAG[type],lat,lng,
    stay:document.getElementById('nStay').value.trim()||'30 分鐘',
    desc:document.getElementById('nDesc').value.trim()||name,
    note:document.getElementById('nNote').value.trim()||'觀察在地人文特色'};
  SPOTS.push(s);addMk(s);
  ['nName','nEmoji','nLat','nLng','nStay','nDesc','nNote'].forEach(i=>document.getElementById(i).value='');
  renderSide();toast(`✅ 已新增「${name}」`);
}

/* ── T: PROMPT ── */
function buildTPrompt(){
  const hasSpots=selOrder.length>0||SPOTS.length>0;
  const prompt=generatePrompt();
  return `<div class="teacher-body">
    <div class="t-section">
      <h3>📋 產生學生網頁 Prompt</h3>
      <p style="font-size:12px;color:#557;line-height:1.7;margin-bottom:10px;">
        複製這份 Prompt → 貼到 <strong>claude.ai</strong> 新對話 →<br>
        Claude 會幫你生成完整的學生互動踏查網頁（HTML）！<br>
        學生拿到網頁後，輸入自己的 Gemini Key 就能使用 AI 功能。
      </p>
      ${selOrder.length===0
        ?`<div style="font-size:12px;color:#e67e22;background:#fff8e0;border:1px solid #f5c842;border-radius:8px;padding:10px;margin-bottom:10px;">⚠️ 請先切換到「學生模式」選取景點並排序，再回來產生 Prompt。</div>`
        :''}
      ${prompt
        ?`<div class="prompt-box">${escHtml(prompt)}</div>
          <div style="display:flex;gap:8px;">
            <button class="btn-full purple" onclick="copyPrompt()" style="margin:0;flex:1">📋 複製 Prompt</button>
            <button class="btn-full amber"  onclick="openClaude()" style="margin:0;flex:1">🤖 開啟 Claude</button>
          </div>`
        :`<div class="prompt-empty">請先在學生模式選取景點並產生路線<br>再切換到教師模式產生 Prompt</div>`
      }
    </div>
  </div>`;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function generatePrompt(){
  if(!route.length&&!selOrder.length) return '';
  const r=route.length?route:selOrder.map(id=>{const s=SPOTS.find(x=>x.id===id);return{...s,walkFromPrev:0};});
  return `請幫我用 HTML + CSS + JavaScript 建立一個完整的人文踏查學習互動網頁，所有內容包成單一 .html 檔案，支援電腦與手機瀏覽器。

【主題資訊】
踏查主題：${cfg.themeTitle}
出發地點：${cfg.stationName}（座標：${cfg.stationLat}, ${cfg.stationLng}）
目標對象：${cfg.targetAudience}
核心人文背景：${cfg.aiContext}

【踏查景點與路線】
${r.map((s,i)=>`第${i+1}站：${s.emoji} ${s.name}（${TYPE_TAG[s.type]}）
  座標：${s.lat}, ${s.lng}　停留：${s.stay}${s.walkFromPrev?`　步行：約${s.walkFromPrev}分鐘`:''}
  說明：${s.desc}
  觀察重點：${s.note}`).join('\n')}

【必備功能需求】

1. 地圖（Leaflet.js + OpenStreetMap，免費無需 API Key）
   - 景點彩色標記（美食紅、景點藍、文化紫），可點擊開啟資訊視窗
   - 路線連線（金色虛線＋箭頭，從出發地依序連到各景點）

2. AI 對話（Gemini API，學生自行輸入 Key）
   - 頁面頂部有 Key 輸入框
   - AI 角色設定為本次踏查嚮導，熟悉主題背景
   - 快速提問按鈕（路線說明、歷史背景、美食、探究主題）

3. 學習單規劃（核心功能）
   - 每個景點有表單：踏查任務、訪問對象、預計提問（≥3題）、觀察重點
   - 每站有「✨ AI 建議」按鈕，呼叫 Gemini 自動填入（學生可修改）
   - 可複製全文或直接開啟新 Google 文件

4. UI 設計
   - 右側標籤頁：景點選取（分類篩選）/ 排序（拖曳）/ 路線結果 / 學習單 / AI 對話
   - 深藍主色 + 金色強調，Noto Serif TC + Noto Sans TC，支援手機觸控
   - 頁面標題：「${cfg.themeTitle} 踏查規劃助手」

請直接輸出完整可執行的 HTML，不需要說明。`;
}
let _lastPrompt='';
function copyPrompt(){_lastPrompt=document.querySelector('.prompt-box')?.textContent||'';navigator.clipboard.writeText(_lastPrompt).then(()=>toast('✅ Prompt 已複製！貼到 Claude 新對話')).catch(()=>toast('請手動複製'));}
function openClaude(){_lastPrompt=document.querySelector('.prompt-box')?.textContent||'';navigator.clipboard.writeText(_lastPrompt).catch(()=>{});window.open('https://claude.ai','_blank');setTimeout(()=>toast('📋 已複製，在 Claude 新對話貼上（Ctrl+V）'),600);}

/* ── T: THEMES ── */
function buildTThemes(){
  const keys=Object.keys(themes);
  const cards=keys.length===0
    ?'<div class="no-thm">尚未儲存主題。在「主題設定」設定好後，點「儲存為主題」。</div>'
    :keys.map(id=>{const t=themes[id];const cur=curThemeId===id;
      return `<div class="thm-card ${cur?'cur':''}">
        <div class="thm-info"><div class="thm-name">${cur?'✅ ':''} ${t.name}</div><div class="thm-meta">${t.spots?.length||0} 個景點・${t.stationName||''}</div></div>
        <div class="thm-btns"><button class="thm-btn load" onclick="loadTheme('${id}')">載入</button><button class="thm-btn del" onclick="delTheme('${id}')">刪除</button></div>
      </div>`;
    }).join('');
  return `<div class="teacher-body">
    <div class="t-section">
      <h3>💾 已儲存主題</h3>
      ${cards}
    </div>
    <div class="t-section">
      <h3>📦 匯入 / 匯出</h3>
      <div style="display:flex;gap:8px;">
        <button class="btn-full green"  style="margin:0;flex:1" onclick="exportThemes()">💾 匯出 JSON</button>
        <button class="btn-full purple" style="margin:0;flex:1" onclick="document.getElementById('importF').click()">📂 匯入 JSON</button>
      </div>
      <input type="file" id="importF" accept=".json" style="display:none" onchange="importThemes(event)">
    </div>
  </div>`;
}
function saveTheme(){
  const name=(document.getElementById('saveThName')?.value||cfg.themeTitle).trim();
  if(!name){toast('請輸入主題名稱');return;}
  const id='t'+Date.now();
  themes[id]={name,...cfg,spots:JSON.parse(JSON.stringify(SPOTS)),savedAt:new Date().toISOString()};
  localStorage.setItem(LS_KEY,JSON.stringify(themes));curThemeId=id;renderSide();toast(`✅ 「${name}」已儲存`);
}
function loadTheme(id){
  const t=themes[id];if(!t)return;
  Object.assign(cfg,{themeTitle:t.themeTitle||t.name,stationName:t.stationName,stationLat:t.stationLat,stationLng:t.stationLng,mapZoom:t.mapZoom||14,aiContext:t.aiContext,targetAudience:t.targetAudience||'高中資優生'});
  SPOTS.length=0;SPOTS.push(...JSON.parse(JSON.stringify(t.spots)));
  selOrder=[];route=[];curThemeId=id;clearRoute();
  rebuildMks();placeStation();lMap.setView([cfg.stationLat,cfg.stationLng],cfg.mapZoom);
  document.getElementById('themeLabel').textContent=cfg.themeTitle;
  renderSide();toast(`✅ 已載入「t.name」`);
}
function delTheme(id){if(!confirm(`刪除「${themes[id]?.name}」？`))return;delete themes[id];if(curThemeId===id)curThemeId=null;localStorage.setItem(LS_KEY,JSON.stringify(themes));renderSide();}
function exportThemes(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(themes,null,2)],{type:'application/json'}));a.download=`踏查主題_${new Date().toISOString().slice(0,10)}.json`;a.click();}
function importThemes(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{Object.assign(themes,JSON.parse(ev.target.result));localStorage.setItem(LS_KEY,JSON.stringify(themes));renderSide();toast('✅ 匯入成功');}catch(err){toast('❌ 格式錯誤');}};r.readAsText(f);e.target.value='';}

// ───────────────────────────────────────
//  TOAST
// ───────────────────────────────────────
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),3000);}

// ───────────────────────────────────────
//  START
// ───────────────────────────────────────
boot();
</script>
