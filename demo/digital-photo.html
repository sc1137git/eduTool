body{font-family:'Noto Sans TC',sans-serif;background:#fff9f0;color:#4a4a4a;margin:0}header{background:#fff;border-bottom:3px solid #f39c12;box-shadow:0 2px 5px rgba(243,156,18,.1)}.item-card{background:#fff;border-radius:12px;overflow:hidden;transition:.25s;border:1px solid #ffe4bc;position:relative}.item-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px -10px rgba(243,156,18,.4);border-color:#f39c12}.item-card.selected{border:3px solid #f39c12;background:#fff1e0}.card-cover{width:100%;aspect-ratio:1/1;background-size:cover;background-position:center;background-color:#fff1e0;display:flex;align-items:center;justify-content:center;position:relative}.select-overlay{position:absolute;top:10px;right:10px;width:24px;height:24px;background:#fff;border:2px solid #f39c12;border-radius:4px;display:none;align-items:center;justify-content:center;z-index:10}.selecting .select-overlay{display:flex}.selected .select-overlay{background:#f39c12;color:#fff}.folder-title{padding:10px 8px;text-align:center;background:#fff;border-top:1px solid #fff1e0}.folder-placeholder{color:#f39c12;font-size:2.5rem;opacity:.4}.control-btn{background:rgba(0,0,0,.6);color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;font-size:1.2rem;border:1px solid rgba(255,255,255,.2)}.control-btn:hover{background:#f39c12;transform:scale(1.08)}.action-btn{padding:8px 16px;border-radius:20px;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;font-weight:500}.loading-spinner{width:40px;height:40px;border:3px solid #f3f3f3;border-top:3px solid #f39c12;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

<body>
<div class="min-h-screen">

<script>
const rootFolderId='{{ROOT_FOLDER_ID}}';
const apiKey='{{API_KEY}}';
const driveApiUrl='https://www.googleapis.com/drive/v3';
const GRID_THUMB=420,VIEW_THUMB=1600,FOLDER_CACHE_MS=120000,COVER_CACHE_MS=43200000,EMPTY_CACHE_MS=600000,MAX_COVER_JOBS=4;
let currentId='',currentSchoolYear='',schoolYearFolderId='',mediaList=[],currentIndex=0,isPlaying=false,isSelectMode=false,playTimer=null,loadSerial=0,activeLoadController=null,coverGeneration=0,activeCoverJobs=0;
const selectedIds=new Set(),rotations={},folderCache=new Map(),coverMemory=new Map(),coverQueued=new Set();
let coverObserver=null,coverQueue=[];
window.addEventListener('load',()=>{bindEvents();initCoverObserver();enterLatestSchoolYear()});
function bindEvents(){
 document.getElementById('btn-close').onclick=closeViewer;document.getElementById('btn-prev').onclick=prev;document.getElementById('btn-next').onclick=next;document.getElementById('btn-rotate').onclick=rotate;document.getElementById('btn-slideshow').onclick=togglePlay;document.getElementById('btn-download').onclick=downloadCurrent;document.getElementById('toggle-select-mode').onclick=toggleSelectMode;document.getElementById('batch-download').onclick=startBatchDownload;
 document.getElementById('refresh-btn').onclick=()=>{if(!currentId||currentId===schoolYearFolderId)enterLatestSchoolYear();else load(currentId,true)};
 document.addEventListener('keydown',e=>{if(document.getElementById('viewer').classList.contains('hidden'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')prev();if(e.key==='ArrowRight')next()});
}
function initCoverObserver(){coverObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;coverObserver.unobserve(el);queueCover(el.dataset.folderId,Number(el.dataset.coverGeneration))}}),{rootMargin:'350px 0px',threshold:.01})}
async function fetchJson(url,options={}){const r=await fetch(url,options);if(!r.ok)throw new Error(`Drive API ${r.status}: ${r.statusText}`);const d=await r.json();if(d.error)throw new Error(d.error.message||'Drive API error');return d}
async function enterLatestSchoolYear(){showLoading(true,'正在尋找最新學年度相簿...');try{const q=`'${rootFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;const r=await fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(q)}&fields=files(id,name)&pageSize=1000&key=${apiKey}`);const ys=(r.files||[]).map(f=>{const m=f.name.trim().match(/^(\d{2,4})/);return m?{...f,year:parseInt(m[1],10)}:null}).filter(Boolean).sort((a,b)=>b.year-a.year||b.name.localeCompare(a.name,'zh-Hant'));if(!ys.length){showNoYear();return}const latest=ys[0];currentSchoolYear=String(latest.year);schoolYearFolderId=latest.id;await load(latest.id)}catch(e){console.error(e);showLoading(false);showLoadError(e)}}
function getFolderCache(id){const c=folderCache.get(id);if(!c)return null;if(Date.now()-c.time>FOLDER_CACHE_MS){folderCache.delete(id);return null}return c.data}
async function load(id,force=false){const serial=++loadSerial;currentId=id;coverGeneration++;isSelectMode=false;selectedIds.clear();updateSelectUI();showLoading(true,'正在讀取雲端內容...');if(activeLoadController)activeLoadController.abort();activeLoadController=new AbortController();try{if(!force){const c=getFolderCache(id);if(c){render(c.name,c.folders,c.files);return}}const s=activeLoadController.signal;const fq=`'${id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,mq=`'${id}' in parents and (mimeType contains 'image/' or mimeType contains 'video/') and trashed=false`;const [meta,fr,mr]=await Promise.all([fetchJson(`${driveApiUrl}/files/${id}?fields=name&key=${apiKey}`,{signal:s}),fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(fq)}&fields=files(id,name)&pageSize=1000&key=${apiKey}`,{signal:s}),fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(mq)}&fields=files(id,name,mimeType)&pageSize=1000&orderBy=name desc&key=${apiKey}`,{signal:s})]);if(serial!==loadSerial)return;const folders=(fr.files||[]).slice().sort((a,b)=>{const n=x=>parseInt((x.match(/^\d+/)||['0'])[0],10);return n(b.name)-n(a.name)||b.name.localeCompare(a.name,'zh-Hant')});const data={name:meta.name,folders,files:mr.files||[]};folderCache.set(id,{time:Date.now(),data});render(data.name,data.folders,data.files)}catch(e){if(e.name!=='AbortError'){console.error(e);showLoadError(e)}}finally{if(serial===loadSerial&&!document.getElementById('loading-area').querySelector('.fa-circle-exclamation'))showLoading(false)}}
function esc(t=''){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function thumb(id,w){return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`}
function render(name,folders,files){updateBread(name);const fg=document.getElementById('folders-grid'),mg=document.getElementById('files-grid');fg.replaceChildren();mg.replaceChildren();const db=document.getElementById('open-drive-btn');db.href=`https://drive.google.com/drive/folders/${currentId}`;db.classList.remove('hidden');const ff=document.createDocumentFragment(),gen=coverGeneration;folders.forEach(f=>{const card=document.createElement('div');card.className='item-card cursor-pointer group';card.innerHTML=`<div class="card-cover" id="cover-${f.id}" data-folder-id="${f.id}" data-cover-generation="${gen}"><i class="fas fa-folder folder-placeholder"></i></div><div class="folder-title"><p class="text-sm font-bold text-gray-700 truncate" title="${esc(f.name)}">${esc(f.name)}</p></div>`;card.onclick=()=>load(f.id);ff.appendChild(card)});fg.appendChild(ff);fg.querySelectorAll('.card-cover[data-folder-id]').forEach(el=>{const c=readCoverCache(el.dataset.folderId);if(c!==undefined){if(c)setCover(el.dataset.folderId,c)}else coverObserver.observe(el)});mediaList=files.map(f=>({id:f.id,name:f.name,isImg:f.mimeType.startsWith('image/'),isMov:f.name.toLowerCase().endsWith('.mov')||f.mimeType==='video/quicktime',thumb:thumb(f.id,GRID_THUMB),src:f.mimeType.startsWith('image/')?thumb(f.id,VIEW_THUMB):`https://drive.google.com/uc?export=download&id=${f.id}`,downloadUrl:`https://drive.google.com/uc?export=download&id=${f.id}`,preview:`https://drive.google.com/file/d/${f.id}/preview`}));const mf=document.createDocumentFragment();mediaList.forEach((m,i)=>{const card=document.createElement('div');card.className='item-card cursor-pointer media-item';card.dataset.id=m.id;card.innerHTML=`<div class="card-cover"><div class="select-overlay"><i class="fas fa-check"></i></div><img src="${m.thumb}" class="w-full h-full object-cover" loading="${i<10?'eager':'lazy'}" decoding="async" fetchpriority="${i<6?'high':'low'}">${!m.isImg?'<div class="absolute inset-0 flex items-center justify-center bg-black/20"><i class="fas fa-play text-white text-3xl"></i></div>':''}</div>`;card.onclick=()=>isSelectMode?toggleSelectItem(m.id,card):openViewer(i);mf.appendChild(card)});mg.appendChild(mf);document.getElementById('main-content').classList.remove('hidden');document.getElementById('toggle-select-mode').classList.toggle('hidden',!mediaList.length)}
function coverKey(id){return `activity-album-cover-v3:${id}`}
function readCoverCache(id){if(coverMemory.has(id))return coverMemory.get(id);try{const raw=sessionStorage.getItem(coverKey(id));if(!raw)return undefined;const o=JSON.parse(raw),max=o.imageId?COVER_CACHE_MS:EMPTY_CACHE_MS;if(Date.now()-o.time>max){sessionStorage.removeItem(coverKey(id));return undefined}const v=o.imageId||null;coverMemory.set(id,v);return v}catch{return undefined}}
function saveCoverCache(id,imageId){const v=imageId||null;coverMemory.set(id,v);try{sessionStorage.setItem(coverKey(id),JSON.stringify({imageId:v,time:Date.now()}))}catch{}}
function queueCover(id,gen){if(!id||gen!==coverGeneration)return;const c=readCoverCache(id);if(c!==undefined){if(c)setCover(id,c);return}if(coverQueued.has(id))return;coverQueued.add(id);coverQueue.push({id,gen});processCoverQueue()}
function processCoverQueue(){while(activeCoverJobs<MAX_COVER_JOBS&&coverQueue.length){const job=coverQueue.shift();if(job.gen!==coverGeneration){coverQueued.delete(job.id);continue}activeCoverJobs++;findCover(job.id).then(img=>{saveCoverCache(job.id,img);if(img&&job.gen===coverGeneration)setCover(job.id,img)}).catch(console.error).finally(()=>{activeCoverJobs--;coverQueued.delete(job.id);processCoverQueue()})}}
async function findCover(id){const q=`'${id}' in parents and mimeType contains 'image/' and trashed=false`;const r=await fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(q)}&fields=files(id)&pageSize=1&key=${apiKey}`);if(r.files?.length)return r.files[0].id;const fq=`'${id}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;const fr=await fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(fq)}&fields=files(id)&pageSize=3&key=${apiKey}`);for(const sub of fr.files||[]){const sq=`'${sub.id}' in parents and mimeType contains 'image/' and trashed=false`;const sr=await fetchJson(`${driveApiUrl}/files?q=${encodeURIComponent(sq)}&fields=files(id)&pageSize=1&key=${apiKey}`);if(sr.files?.length)return sr.files[0].id}return null}
function setCover(id,img){const el=document.getElementById(`cover-${id}`);if(el){el.style.backgroundImage=`url(${thumb(img,GRID_THUMB)})`;el.innerHTML=''}}
function toggleSelectMode(){isSelectMode=!isSelectMode;const b=document.getElementById('toggle-select-mode'),g=document.getElementById('files-grid');if(isSelectMode){b.innerHTML='<i class="fas fa-times"></i> 取消選取';b.classList.replace('bg-gray-200','bg-gray-700');b.classList.replace('text-gray-700','text-white');g.classList.add('selecting')}else{b.innerHTML='<i class="fas fa-check-square"></i> 選取照片';b.classList.replace('bg-gray-700','bg-gray-200');b.classList.replace('text-white','text-gray-700');g.classList.remove('selecting');selectedIds.clear();document.querySelectorAll('.media-item').forEach(e=>e.classList.remove('selected'))}updateSelectUI()}
function toggleSelectItem(id,el){if(selectedIds.has(id)){selectedIds.delete(id);el.classList.remove('selected')}else{selectedIds.add(id);el.classList.add('selected')}updateSelectUI()}
function updateSelectUI(){document.getElementById('select-count').innerText=selectedIds.size;document.getElementById('batch-download').classList.toggle('hidden',!selectedIds.size)}
function loadScript(src,name){return new Promise((ok,bad)=>{if(window[name])return ok();const old=document.querySelector(`script[data-dynamic-src="${src}"]`);if(old){old.addEventListener('load',ok,{once:true});old.addEventListener('error',bad,{once:true});return}const s=document.createElement('script');s.src=src;s.async=true;s.dataset.dynamicSrc=src;s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function startBatchDownload(){if(!selectedIds.size)return;showLoading(true,`準備打包 ${selectedIds.size} 個檔案...`);try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip');const zip=new JSZip(),items=mediaList.filter(m=>selectedIds.has(m.id));let done=0;for(let i=0;i<items.length;i+=3){await Promise.all(items.slice(i,i+3).map(async item=>{const r=await fetch(item.downloadUrl);if(!r.ok)throw new Error(`下載失敗：${item.name}`);zip.file(item.name,await r.blob());done++;document.getElementById('loading-text').innerText=`正在下載 ${done}/${items.length}...`}))}document.getElementById('loading-text').innerText='正在建立 ZIP...';const blob=await zip.generateAsync({type:'blob',compression:'STORE'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`相簿下載_${Date.now()}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toggleSelectMode()}catch(e){console.error(e);alert('下載失敗，請嘗試單張下載或確認網路連線。')}finally{showLoading(false)}}
function openViewer(i){currentIndex=i;document.getElementById('viewer').classList.remove('hidden');document.body.style.overflow='hidden';showMedia()}
function showMedia(){if(!mediaList.length)return;const m=mediaList[currentIndex],img=document.getElementById('view-img'),vid=document.getElementById('view-video'),mov=document.getElementById('view-mov');vid.pause();[img,vid,mov].forEach(e=>e.style.display='none');if(m.isImg){img.src=m.src;img.style.display='block';img.style.transform=`rotate(${rotations[m.id]||0}deg)`}else if(m.isMov){mov.src=m.preview;mov.style.display='block'}else{vid.src=m.src;vid.style.display='block';vid.play().catch(()=>{})}preloadNeighbors()}
function preloadNeighbors(){if(mediaList.length<2)return;[(currentIndex+1)%mediaList.length,(currentIndex-1+mediaList.length)%mediaList.length].forEach(i=>{const m=mediaList[i];if(m?.isImg){const x=new Image();x.src=m.src}})}
function next(){if(mediaList.length){currentIndex=(currentIndex+1)%mediaList.length;showMedia()}}function prev(){if(mediaList.length){currentIndex=(currentIndex-1+mediaList.length)%mediaList.length;showMedia()}}
function rotate(){const m=mediaList[currentIndex];if(!m?.isImg)return;rotations[m.id]=((rotations[m.id]||0)+90)%360;document.getElementById('view-img').style.transform=`rotate(${rotations[m.id]}deg)`}
function togglePlay(){isPlaying=!isPlaying;const b=document.getElementById('btn-slideshow');if(isPlaying){b.innerHTML='<i class="fas fa-pause"></i>';playTimer=setInterval(next,3000)}else{b.innerHTML='<i class="fas fa-play"></i>';clearInterval(playTimer);playTimer=null}}
function downloadCurrent(){const m=mediaList[currentIndex];if(!m)return;const a=document.createElement('a');a.href=m.downloadUrl;a.download=m.name;a.target='_blank';a.click()}
function closeViewer(){document.getElementById('viewer').classList.add('hidden');document.body.style.overflow='';const v=document.getElementById('view-video'),m=document.getElementById('view-mov');v.pause();v.removeAttribute('src');m.removeAttribute('src');if(isPlaying)togglePlay()}
function updateBread(name){const b=document.getElementById('breadcrumb');b.innerHTML=`<span class="cursor-pointer hover:text-[#f39c12]" onclick="enterLatestSchoolYear()">${currentSchoolYear?currentSchoolYear+' 學年度':'最新學年度'}</span>`;if(currentId&&currentId!==schoolYearFolderId)b.innerHTML+=` <i class="fas fa-chevron-right text-[10px] mx-2 text-gray-300"></i><span class="text-[#f39c12] font-bold">${esc(name)}</span>`}
function showLoading(on,text='正在載入...'){document.getElementById('loading-area').classList.toggle('hidden',!on);document.getElementById('main-content').classList.toggle('hidden',on);document.getElementById('loading-text').innerText=text}
function showNoYear(){currentId='';currentSchoolYear='';schoolYearFolderId='';document.getElementById('main-content').classList.add('hidden');document.getElementById('open-drive-btn').classList.add('hidden');document.getElementById('toggle-select-mode').classList.add('hidden');const l=document.getElementById('loading-area');l.classList.remove('hidden');l.innerHTML='<div class="text-center py-14 px-6"><div class="text-5xl mb-4">📸</div><p class="text-xl font-bold text-gray-700 mb-2">尚未找到學年度相簿</p><p class="text-gray-400 text-sm mb-5">請在 Root 建立以年度數字開頭的資料夾，例如「115學年度」。</p><button onclick="location.reload()" class="action-btn bg-[#f39c12] text-white"><i class="fas fa-sync-alt"></i> 重新檢查</button></div>'}
function showLoadError(e){const l=document.getElementById('loading-area');l.classList.remove('hidden');l.innerHTML=`<div class="text-center py-12"><i class="fas fa-circle-exclamation text-4xl text-[#f39c12] mb-4"></i><p class="font-bold text-gray-700 mb-2">相簿載入失敗</p><p class="text-gray-400 text-sm mb-4">${esc(e.message||'請稍後再試')}</p><button onclick="location.reload()" class="action-btn bg-[#f39c12] text-white">重新載入</button></div>`}
</script>
</body>

<script>
function extractFolderId(input){const v=input.trim(),m=v.match(/folders\/([a-zA-Z0-9_-]+)/),q=v.match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?m[1]:q?q[1]:v}
function escapeTemplateText(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function generateApp(){let school=document.getElementById('input-school-name').value.trim();const key=document.getElementById('input-api-key').value.trim(),root=document.getElementById('input-root-folder').value.trim();if(!key||!root){alert('請填寫 Google API Key 與 Root 資料夾！');return}if(!school)school='活動相簿';school=escapeTemplateText(school);const template=document.getElementById('app-template').value,html=template.replace(/\{\{SCHOOL_NAME\}\}/g,()=>school).replace(/\{\{API_KEY\}\}/g,()=>key).replace(/\{\{ROOT_FOLDER_ID\}\}/g,()=>extractFolderId(root));document.getElementById('preview-iframe').srcdoc=html;document.getElementById('code-output').value=html;switchTab('preview');const b=document.getElementById('btn-generate'),old=b.innerHTML;b.innerHTML='✓ 生成成功！';b.classList.add('bg-green-600');b.classList.remove('bg-orange-600');setTimeout(()=>{b.innerHTML=old;b.classList.remove('bg-green-600');b.classList.add('bg-orange-600')},1500)}
async function copyCode(){const out=document.getElementById('code-output');if(!out.value){alert('請先點擊「生成相簿」！');return}try{await navigator.clipboard.writeText(out.value)}catch{out.classList.remove('hidden');out.select();document.execCommand('copy')}const b=document.getElementById('btn-copy'),old=b.innerHTML;b.innerHTML='<span class="text-green-400">✓ 已複製</span>';b.classList.add('border-green-500');setTimeout(()=>{b.innerHTML=old;b.classList.remove('border-green-500')},1800)}
function switchTab(t){const i=document.getElementById('preview-iframe'),c=document.getElementById('code-output'),p=document.getElementById('tab-preview'),o=document.getElementById('tab-code');if(t==='preview'){i.classList.remove('hidden');c.classList.add('hidden');p.className='px-6 py-3 text-sm font-medium border-t-2 border-orange-500 bg-gray-800 text-white';o.className='px-6 py-3 text-sm font-medium border-t-2 border-transparent text-gray-400'}else{i.classList.add('hidden');c.classList.remove('hidden');o.className='px-6 py-3 text-sm font-medium border-t-2 border-orange-500 bg-gray-800 text-white';p.className='px-6 py-3 text-sm font-medium border-t-2 border-transparent text-gray-400'}}
</script>
